name: Prisma schema validation

on:
  pull_request:
    paths:
      - "prisma/**"
      - ".github/workflows/prisma-validate.yml"
  push:
    branches: [main]
    paths:
      - "prisma/**"
      - ".github/workflows/prisma-validate.yml"

permissions:
  contents: read

concurrency:
  group: prisma-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate database schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/njira?schema=public
        run: npx --yes prisma@6.19.3 validate --schema prisma/schema.prisma
